name: image_picker_ios_chat_v2
description: iOS implementation of the image_picker plugin.
repository: https://github.com/flutter/packages/tree/main/packages/image_picker/image_picker_ios
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+image_picker%22
version: 0.8.13+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

flutter:
  plugin:
    implements: image_picker_chat_v2
    platforms:
      ios:
        dartPluginClass: ImagePickerIOSChatV2
        pluginClass: FLTImagePickerPlugin_V2

dependencies:
  flutter:
    sdk: flutter
  image_picker_platform_interface: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  pigeon: ^22.4.1

topics:
  - camera
  - image-picker
  - files
  - file-selection
